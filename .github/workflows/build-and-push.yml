name: Build and Push Docker Images

on:
  workflow_run:
    workflows: ["CI / Fast Feedback", "Security Audit & Container Vulnerability Scan"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Multi-Arch Build & Push to GHCR
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Calculate Short Git SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Owner Name
        id: repo_name
        run: echo "owner_lowercase=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push API Image (Multi-Arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.owner_lowercase }}/file-convert-api-api:latest
            ghcr.io/${{ steps.repo_name.outputs.owner_lowercase }}/file-convert-api-api:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ steps.repo_name.outputs.owner_lowercase }}/file-convert-api-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Worker Image (Multi-Arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.owner_lowercase }}/file-convert-api-worker:latest
            ghcr.io/${{ steps.repo_name.outputs.owner_lowercase }}/file-convert-api-worker:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ steps.repo_name.outputs.owner_lowercase }}/file-convert-api-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
