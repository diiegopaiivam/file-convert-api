name: CD / Deploy to Oracle Cloud VM

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production VM via SSH
    # Bloqueio rigoroso: executa EXCLUSIVAMENTE na branch main nativa do repositório (nunca de forks) e após conclusão com sucesso do build
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Mask Sensitive Deployment Inputs
        run: |
          echo "::add-mask::${{ secrets.OCI_VM_HOST }}"
          echo "::add-mask::${{ secrets.OCI_VM_USER }}"
          echo "::add-mask::${{ secrets.OCI_VM_SSH_KEY }}"

      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_VM_HOST }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.OCI_VM_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail

            echo "==> [1/4] Identificando diretório de deploy na VM OCI..."
            DEPLOY_DIR=""
            if [ -d "/opt/file-convert-api/deploy" ]; then
              DEPLOY_DIR="/opt/file-convert-api/deploy"
            elif [ -d "/opt/file-convert-api" ]; then
              DEPLOY_DIR="/opt/file-convert-api"
            elif [ -d "$HOME/file-convert-api/deploy" ]; then
              DEPLOY_DIR="$HOME/file-convert-api/deploy"
            elif [ -d "$HOME/file-convert-api" ]; then
              DEPLOY_DIR="$HOME/file-convert-api"
            elif [ -d "/home/${{ secrets.OCI_VM_USER }}/file-convert-api/deploy" ]; then
              DEPLOY_DIR="/home/${{ secrets.OCI_VM_USER }}/file-convert-api/deploy"
            else
              echo "ERRO CRÍTICO: Nenhum diretório de deploy válido encontrado na VM!"
              exit 1
            fi

            cd "$DEPLOY_DIR"
            echo "Diretório ativo: $(pwd)"

            echo "==> [2/4] Atualizando imagens de contêiner do GHCR via Docker Compose..."
            docker compose pull

            echo "==> [3/4] Reiniciando os serviços em segundo plano (zero-downtime rolling update)..."
            docker compose up -d --remove-orphans

            echo "==> [4/4] Higienização de imagens e camadas antigas não referenciadas..."
            docker image prune -af --filter "until=24h"

            echo "==> Pipeline CD / Deploy concluído com sucesso!"
