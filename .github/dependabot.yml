version: 2
updates:
  # 1. Ecossistema Go: Monitora dependências em go.mod e go.sum
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
      - "golang"
    commit-message:
      prefix: "chore(deps)"

  # 2. Ecossistema Docker: Monitora imagens base dos Dockerfiles em deploy/docker/ (Dockerfile.api e Dockerfile.worker)
  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "docker"
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(docker)"

  # 3. Ecossistema GitHub Actions: Monitora versões das actions em .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
