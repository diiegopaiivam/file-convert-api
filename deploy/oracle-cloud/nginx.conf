# Configuration Nginx Hardened para Oracle Cloud Infrastructure (OCI) - FileConvert API

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Ocultar versão do Nginx

    # Limite máximo de payload alinhado ao ADR 0006 (50 MB)
    client_max_body_size 50M;

    # Server HTTP (Porta 80) - Redirecionamento HTTPS e Desafio Let's Encrypt (ACME)
    server {
        listen 80;
        listen [::]:80;
        server_name api.fileconvert.example.com _;

        # Endpoint para validação do Certbot / Let's Encrypt ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Redirecionamento permanente de HTTP para HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Server HTTPS (Porta 443) - Reverse Proxy Protegido com TLS 1.2 / 1.3
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.fileconvert.example.com;

        # Certificados TLS gerenciados via Certbot / Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/api.fileconvert.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.fileconvert.example.com/privkey.pem;

        # Protocolos e Ciphers Criptográficos Seguros
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Cabeçalhos de Segurança da Infraestrutura (Hardening)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

        # Proxy reverso para o serviço API Go internal
        location / {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts de Proxy alinhados ao SLA máximo de 60s
            proxy_connect_timeout 10s;
            proxy_send_timeout 65s;
            proxy_read_timeout 65s;
        }

        # Repasses para métricas se acessado externamente (protegido por IP/Auth se necessário)
        location /metrics {
            proxy_pass http://api:8080/metrics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
