basePath: /
definitions:
  domain.APIErrorResponse:
    properties:
      code:
        type: string
      details:
        items:
          $ref: '#/definitions/domain.ErrorDetail'
        type: array
      message:
        type: string
      timestamp:
        type: string
    type: object
  domain.ErrorDetail:
    properties:
      field:
        type: string
      issue:
        type: string
    type: object
  domain.Format:
    enum:
    - wav
    - mp3
    - jpg
    - png
    - pdf
    - doc
    - docx
    type: string
    x-enum-varnames:
    - FormatWAV
    - FormatMP3
    - FormatJPG
    - FormatPNG
    - FormatPDF
    - FormatDOC
    - FormatDOCX
  domain.JobError:
    properties:
      code:
        type: string
      details:
        items:
          $ref: '#/definitions/domain.ErrorDetail'
        type: array
      message:
        type: string
    type: object
  domain.JobStatus:
    enum:
    - pending
    - processing
    - done
    - failed
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusProcessing
    - StatusDone
    - StatusFailed
  http.ConversionJobResponse:
    properties:
      created_at:
        example: "2026-09-14T15:00:00Z"
        type: string
      job_id:
        example: job_a1b2c3d4
        type: string
      source_format:
        allOf:
        - $ref: '#/definitions/domain.Format'
        example: wav
      status:
        allOf:
        - $ref: '#/definitions/domain.JobStatus'
        example: pending
      target_format:
        allOf:
        - $ref: '#/definitions/domain.Format'
        example: mp3
    type: object
  http.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  http.JobStatusResponse:
    properties:
      created_at:
        example: "2026-09-14T15:00:00Z"
        type: string
      download_url:
        example: /v1/jobs/job_a1b2c3d4/download
        type: string
      error:
        $ref: '#/definitions/domain.JobError'
      job_id:
        example: job_a1b2c3d4
        type: string
      source_format:
        allOf:
        - $ref: '#/definitions/domain.Format'
        example: wav
      status:
        allOf:
        - $ref: '#/definitions/domain.JobStatus'
        example: done
      target_format:
        allOf:
        - $ref: '#/definitions/domain.Format'
        example: mp3
      updated_at:
        example: "2026-09-14T15:00:10Z"
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: security@fileconvert.example.com
    name: Suporte FileConvert API
  description: API de conversão assíncrona de arquivos de alto desempenho (Hexagonal
    Architecture), cobrindo as famílias de Áudio (.wav ↔ .mp3), Imagem/PDF (.jpg/.png
    ↔ .pdf) e Documentos (.doc/.docx → .pdf).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: FileConvert API
  version: "1.0"
paths:
  /health:
    get:
      description: Endpoint público para verificação da saúde do serviço
      produces:
      - application/json
      responses:
        "200":
          description: Status OK
          schema:
            $ref: '#/definitions/http.HealthResponse'
      summary: Health Check
      tags:
      - Health
  /v1/conversions:
    post:
      consumes:
      - multipart/form-data
      description: 'Endpoint genérico para conversão assíncrona cobrindo todas as
        famílias suportadas: Áudio (.wav ↔ .mp3), Imagem/PDF (.jpg/.png ↔ .pdf) e
        Documentos (.doc/.docx → .pdf).'
      parameters:
      - description: Arquivo de entrada (.wav, .mp3, .jpg, .png, .pdf, .doc, .docx,
          máx 50 MB)
        in: formData
        name: file
        required: true
        type: file
      - description: Formato de destino desejado ('mp3', 'wav', 'pdf', 'jpg')
        in: formData
        name: target_format
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: 'Job criado e enfileirado com sucesso (status: pending)'
          schema:
            $ref: '#/definitions/http.ConversionJobResponse'
        "400":
          description: Arquivo vazio ou parâmetros inválidos
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "401":
          description: Autenticação necessária / Chave de API inválida
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "413":
          description: Arquivo enviado excede o limite de 50 MB
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "415":
          description: Par de formatos de conversão não suportado
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "429":
          description: Limite de requisições por segundo ou quota de jobs simultâneos
            excedida
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Criar job de conversão unificado
      tags:
      - Conversions
  /v1/conversions/audio:
    post:
      consumes:
      - multipart/form-data
      description: 'Recebe um arquivo de áudio (.wav ou .mp3) de até 50 MB e enfileira
        um job de conversão assíncrona. Formatos suportados: .wav ↔ .mp3.'
      parameters:
      - description: Arquivo de áudio de entrada (.wav ou .mp3, máx 50 MB)
        in: formData
        name: file
        required: true
        type: file
      - description: Formato de destino desejado ('mp3' ou 'wav')
        in: formData
        name: target_format
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: 'Job criado e enfileirado com sucesso (status: pending)'
          schema:
            $ref: '#/definitions/http.ConversionJobResponse'
        "400":
          description: Arquivo vazio ou parâmetros inválidos
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "401":
          description: Autenticação necessária / Chave de API inválida
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "413":
          description: Arquivo enviado excede o limite de 50 MB
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "415":
          description: Par de formatos de conversão não suportado
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "429":
          description: Limite de requisições por segundo ou quota de jobs simultâneos
            excedida
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Criar job de conversão de áudio
      tags:
      - Conversions
  /v1/conversions/document:
    post:
      consumes:
      - multipart/form-data
      description: 'Recebe um documento de texto (.doc ou .docx) de até 50 MB e enfileira
        um job de conversão assíncrona para PDF (.pdf). Formatos suportados: .doc/.docx
        → .pdf.'
      parameters:
      - description: Arquivo de documento de entrada (.doc ou .docx, máx 50 MB)
        in: formData
        name: file
        required: true
        type: file
      - description: Formato de destino desejado ('pdf')
        in: formData
        name: target_format
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: 'Job criado e enfileirado com sucesso (status: pending)'
          schema:
            $ref: '#/definitions/http.ConversionJobResponse'
        "400":
          description: Arquivo vazio ou parâmetros inválidos
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "401":
          description: Autenticação necessária / Chave de API inválida
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "413":
          description: Arquivo enviado excede o limite de 50 MB
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "415":
          description: Par de formatos de conversão não suportado
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "429":
          description: Limite de requisições por segundo ou quota de jobs simultâneos
            excedida
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Criar job de conversão de documento
      tags:
      - Conversions
  /v1/conversions/image:
    post:
      consumes:
      - multipart/form-data
      description: 'Recebe uma imagem (.jpg, .png) para conversão para PDF (.pdf),
        ou um arquivo PDF (.pdf) para conversão para imagem (.jpg). Arquivos PDF multipáginas
        geram saída empacotada em arquivo .zip. Formatos suportados: .jpg/.png → .pdf
        e .pdf → .jpg.'
      parameters:
      - description: Arquivo de imagem ou PDF de entrada (.jpg, .png ou .pdf, máx
          50 MB)
        in: formData
        name: file
        required: true
        type: file
      - description: Formato de destino desejado ('pdf' ou 'jpg')
        in: formData
        name: target_format
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: 'Job criado e enfileirado com sucesso (status: pending)'
          schema:
            $ref: '#/definitions/http.ConversionJobResponse'
        "400":
          description: Arquivo vazio ou parâmetros inválidos
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "401":
          description: Autenticação necessária / Chave de API inválida
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "413":
          description: Arquivo enviado excede o limite de 50 MB
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "415":
          description: Par de formatos de conversão não suportado
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "429":
          description: Limite de requisições por segundo ou quota de jobs simultâneos
            excedida
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Criar job de conversão de imagem e PDF
      tags:
      - Conversions
  /v1/jobs/{job_id}:
    get:
      description: Retorna o estado atual do job de conversão e o URL de download
        caso concluído com sucesso.
      parameters:
      - description: ID único do job
        in: path
        name: job_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Status e detalhes do job
          schema:
            $ref: '#/definitions/http.JobStatusResponse'
        "401":
          description: Autenticação necessária / Chave de API inválida
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "404":
          description: Job não encontrado
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "429":
          description: Limite de requisições excedido
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Consultar status do job
      tags:
      - Jobs
  /v1/jobs/{job_id}/download:
    get:
      description: Realiza o download do arquivo binário gerado pela conversão concluída
        (ou arquivo .zip em caso de PDF multipáginas).
      parameters:
      - description: ID único do job
        in: path
        name: job_id
        required: true
        type: string
      produces:
      - application/octet-stream
      - audio/mpeg
      - audio/wav
      - application/pdf
      - image/jpeg
      - image/png
      - application/zip
      responses:
        "200":
          description: Arquivo binário convertido
          schema:
            type: file
        "400":
          description: Job ainda não concluído ou sem arquivo gerado
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "401":
          description: Autenticação necessária / Chave de API inválida
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "404":
          description: Job ou arquivo não encontrado no storage (expirado após 24h)
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "429":
          description: Limite de requisições excedido
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/domain.APIErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Baixar resultado da conversão
      tags:
      - Jobs
securityDefinitions:
  ApiKeyAuth:
    description: Autenticação via cabeçalho X-API-Key
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: 'Autenticação via cabeçalho Authorization: Bearer <api_key>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
